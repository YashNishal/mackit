name: Refresh catalog

on:
  schedule:
  // once a month
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  catalog:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run catalog
      - run: bun run hash-installer
      - name: Commit refreshed catalog
        run: |
          git config user.name "mackit-bot"
          git config user.email "mackit-bot@users.noreply.github.com"
          git add public/catalog public/install/v1/mackit-install.meta.json
          git diff --cached --quiet || git commit -m "chore: refresh Homebrew catalog"
          git push
